[package]
name = "doslab"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
jpeg-encoder = "0.7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

# Video handles ~30 full frames a second (D-Bus decoding, pixel conversion, JPEG), far too slow
# unoptimized: a game's frames would queue up and lag seconds behind. Keep `cargo run` usable.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
