[package]
name = "doslab"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
jpeg-encoder = "0.7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

# JPEG encoding and D-Bus pixel decoding are far too slow unoptimized; keep `cargo run` usable.
[profile.dev.package."*"]
opt-level = 3
